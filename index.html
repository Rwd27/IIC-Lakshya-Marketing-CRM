<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IIC Lakshya Marketing CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#161F2E; --ink-2:#25334A; --ink-3:#42536E;
  --paper:#F7F4EC; --paper-2:#FFFFFF; --line:#DCD5C4; --line-soft:#EAE4D6;
  --brass:#A5793A; --brass-deep:#82601F; --brass-tint:#F1E4CC;
  --teal:#2E6B5E; --teal-tint:#DEEBE6;
  --rust:#8C4632; --rust-tint:#F1DED7;
  --slate:#5A6A83; --slate-tint:#E7EAF0;
  --gold:#B08A3E;
  --shadow: 0 1px 2px rgba(22,31,46,.06);
  --radius: 3px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:'Newsreader',serif; font-weight:500; margin:0; color:var(--ink);}
::selection{background:var(--brass-tint);}
a{color:inherit;}
button{font-family:'Inter',sans-serif; cursor:pointer;}
input,select,textarea{font-family:'Inter',sans-serif; font-size:13.5px;}
::-webkit-scrollbar{width:9px; height:9px;}
::-webkit-scrollbar-thumb{background:var(--line); border-radius:6px;}

#app{display:flex; min-height:100vh;}

/* ---------- Sidebar ---------- */
.sidebar{
  width:220px; background:var(--ink); color:#CBD3E1; flex-shrink:0;
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand{padding:22px 20px 16px; border-bottom:1px solid rgba(255,255,255,.08);}
.brand-mark{font-family:'Newsreader',serif; font-size:19px; color:#fff; letter-spacing:.2px;}
.brand-sub{font-size:10.5px; color:#8592A8; margin-top:4px; letter-spacing:.3px;}
.demo-pill{display:inline-block; margin-top:8px; font-size:9.5px; padding:2px 7px; border:1px solid rgba(255,255,255,.18); border-radius:20px; color:#B7C0D2; font-family:'IBM Plex Mono',monospace; letter-spacing:.5px;}
.nav{padding:14px 10px; flex:1;}
.nav-group{margin-bottom:4px;}
.nav-label{font-size:10px; color:#5E6B82; margin:14px 12px 6px; font-family:'IBM Plex Mono',monospace; letter-spacing:.6px;}
.nav-item{
  display:flex; align-items:center; gap:9px; padding:8px 12px; border-radius:4px;
  font-size:13.5px; color:#B7C0D2; cursor:pointer; transition:background .12s;
}
.nav-item:hover{background:rgba(255,255,255,.06); color:#fff;}
.nav-item.active{background:var(--brass); color:#fff;}
.nav-dot{width:5px; height:5px; border-radius:50%; background:currentColor; opacity:.55; flex-shrink:0;}
.nav-item.active .nav-dot{opacity:1;}
.nav-badge{margin-left:auto; font-size:10.5px; background:rgba(255,255,255,.1); padding:1px 6px; border-radius:20px;}

/* ---------- Main ---------- */
.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  background:var(--paper-2); border-bottom:1px solid var(--line); padding:12px 26px;
  display:flex; align-items:center; gap:14px; position:sticky; top:0; z-index:30;
}
.search-wrap{position:relative; flex:1; max-width:420px;}
.search-input{
  width:100%; padding:8px 12px 8px 30px; border:1px solid var(--line); border-radius:4px;
  background:var(--paper); font-size:13px; outline:none;
}
.search-input:focus{border-color:var(--brass);}
.search-icon{position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--ink-3); font-size:13px;}
.search-results{
  position:absolute; top:110%; left:0; right:0; background:#fff; border:1px solid var(--line);
  border-radius:4px; box-shadow:0 8px 24px rgba(22,31,46,.14); max-height:340px; overflow-y:auto; z-index:50;
}
.search-results .sr-group{padding:6px 12px; font-size:10.5px; color:var(--ink-3); font-family:'IBM Plex Mono',monospace; letter-spacing:.4px; border-top:1px solid var(--line-soft);}
.search-results .sr-item{padding:8px 12px; cursor:pointer; display:flex; justify-content:space-between; font-size:13px;}
.search-results .sr-item:hover{background:var(--paper);}
.topbar-right{display:flex; align-items:center; gap:10px; margin-left:auto;}
.country-select, .role-select{
  padding:7px 10px; border:1px solid var(--line); border-radius:4px; background:#fff; font-size:12.5px; color:var(--ink-2);
}
.bell{position:relative; padding:7px 9px; border:1px solid var(--line); border-radius:4px; background:#fff;}
.bell .dot{position:absolute; top:5px; right:5px; width:6px; height:6px; background:var(--rust); border-radius:50%;}
.user-chip{display:flex; align-items:center; gap:8px; padding:5px 10px 5px 5px; border:1px solid var(--line); border-radius:20px; background:#fff;}
.avatar{width:24px; height:24px; border-radius:50%; background:var(--brass); color:#fff; display:flex; align-items:center; justify-content:center; font-size:11px; font-family:'IBM Plex Mono',monospace;}

.content{padding:26px 30px 60px; max-width:1400px; width:100%; margin:0 auto;}
.page-head{display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:20px; gap:16px; flex-wrap:wrap;}
.page-head h1{font-size:26px;}
.page-sub{color:var(--ink-3); font-size:13px; margin-top:4px;}
.btn{
  display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:4px; border:1px solid var(--ink);
  background:var(--ink); color:#fff; font-size:13px; font-weight:500; transition:opacity .12s;
}
.btn:hover{opacity:.85;}
.btn.secondary{background:#fff; color:var(--ink); border-color:var(--line);}
.btn.brass{background:var(--brass); border-color:var(--brass);}
.btn.ghost{background:transparent; border-color:transparent; color:var(--ink-3); padding:6px 8px;}
.btn.small{padding:5px 10px; font-size:12px;}
.btn.danger{background:#fff; color:var(--rust); border-color:var(--rust-tint);}
.btn:disabled{opacity:.4; cursor:not-allowed;}

/* KPI */
.kpi-row{display:grid; grid-template-columns:repeat(5,1fr); gap:1px; background:var(--line); border:1px solid var(--line); margin-bottom:24px; border-radius:4px; overflow:hidden;}
.kpi{background:#fff; padding:16px 18px;}
.kpi-label{font-size:11px; color:var(--ink-3); text-transform:none; letter-spacing:.2px;}
.kpi-val{font-family:'Newsreader',serif; font-size:28px; margin-top:6px;}
.kpi-delta{font-size:11px; margin-top:5px; color:var(--teal);}
.kpi-delta.down{color:var(--rust);}

/* Panels */
.panel{background:#fff; border:1px solid var(--line); border-radius:4px; margin-bottom:22px;}
.panel-head{padding:14px 18px; border-bottom:1px solid var(--line-soft); display:flex; align-items:center; justify-content:space-between;}
.panel-head h3{font-size:15.5px;}
.panel-body{padding:18px;}
.two-col{display:grid; grid-template-columns:1.4fr 1fr; gap:20px;}
@media(max-width:1100px){.two-col{grid-template-columns:1fr;} .kpi-row{grid-template-columns:repeat(2,1fr);}}

/* Funnel */
.funnel{display:flex; overflow-x:auto; gap:2px; padding-bottom:4px;}
.funnel-step{flex:1; min-width:104px; background:var(--paper); border:1px solid var(--line-soft); padding:12px 10px; text-align:center; position:relative;}
.funnel-step .fn{font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--brass-deep);}
.funnel-step .fv{font-family:'Newsreader',serif; font-size:20px; margin-top:4px;}
.funnel-step .fl{font-size:10.5px; color:var(--ink-3); margin-top:2px;}
.funnel-step:after{content:"›"; position:absolute; right:-9px; top:50%; transform:translateY(-50%); color:var(--line); font-size:16px; z-index:2;}
.funnel-step:last-child:after{content:"";}

/* Tables */
table{width:100%; border-collapse:collapse; font-size:13px;}
th{text-align:left; font-size:11px; color:var(--ink-3); font-weight:500; padding:9px 12px; border-bottom:1px solid var(--line); white-space:nowrap; font-family:'IBM Plex Mono',monospace; letter-spacing:.2px;}
td{padding:10px 12px; border-bottom:1px solid var(--line-soft); vertical-align:middle;}
tr.clickable{cursor:pointer;}
tr.clickable:hover td{background:var(--paper);}
.tbl-wrap{overflow-x:auto;}

.badge{display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:500; white-space:nowrap;}
.badge.p-high{background:var(--rust-tint); color:var(--rust);}
.badge.p-medium{background:var(--brass-tint); color:var(--brass-deep);}
.badge.p-low{background:var(--slate-tint); color:var(--slate);}
.badge.st{background:var(--slate-tint); color:var(--ink-2);}
.badge.st.good{background:var(--teal-tint); color:var(--teal);}
.badge.st.warn{background:var(--brass-tint); color:var(--brass-deep);}
.badge.st.bad{background:var(--rust-tint); color:var(--rust);}
.tag{display:inline-block; background:var(--paper); border:1px solid var(--line); padding:1px 7px; border-radius:20px; font-size:10.5px; color:var(--ink-2); margin-right:4px;}

/* Filters bar */
.filters{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; align-items:center;}
.filters select, .filters input[type=text]{padding:7px 10px; border:1px solid var(--line); border-radius:4px; background:#fff; font-size:12.5px; min-width:120px;}
.filters .fcount{margin-left:auto; font-size:12px; color:var(--ink-3);}

/* Forms/modal */
.modal-bg{position:fixed; inset:0; background:rgba(22,26,34,.5); z-index:100; display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; overflow-y:auto;}
.modal{background:#fff; border-radius:6px; width:100%; max-width:640px; box-shadow:0 20px 60px rgba(0,0,0,.25);}
.modal.wide{max-width:920px;}
.modal-head{padding:18px 22px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;}
.modal-head h3{font-size:17px;}
.modal-close{background:none; border:none; font-size:20px; color:var(--ink-3); line-height:1;}
.modal-body{padding:20px 22px; max-height:70vh; overflow-y:auto;}
.modal-foot{padding:14px 22px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:8px;}
.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.form-grid.c1{grid-template-columns:1fr;}
.field{display:flex; flex-direction:column; gap:5px;}
.field label{font-size:11.5px; color:var(--ink-3); font-weight:500;}
.field input, .field select, .field textarea{
  padding:8px 10px; border:1px solid var(--line); border-radius:4px; background:var(--paper); outline:none;
}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--brass); background:#fff;}
.field textarea{resize:vertical; min-height:60px;}
.span2{grid-column:span 2;}

/* Empty state */
.empty{text-align:center; padding:50px 20px; color:var(--ink-3);}
.empty h3{color:var(--ink-2); margin-bottom:6px;}

/* Tabs */
.contact-multi-row{display:flex; gap:6px; align-items:center; margin-bottom:6px;}
.contact-multi-row input{flex:1; padding:7px 9px; border:1px solid var(--line); border-radius:4px; background:var(--paper); font-size:13px; outline:none;}
.contact-multi-row input:focus{border-color:var(--brass);}
.tabs{display:flex; gap:2px; border-bottom:1px solid var(--line); margin-bottom:18px;}
.tab{padding:9px 14px; font-size:13px; color:var(--ink-3); border-bottom:2px solid transparent; cursor:pointer;}
.tab.active{color:var(--ink); border-color:var(--brass); font-weight:500;}

/* Pipeline kanban */
.kanban{display:flex; gap:12px; overflow-x:auto; padding-bottom:14px;}
.kcol{background:var(--paper); border:1px solid var(--line-soft); border-radius:5px; min-width:230px; flex-shrink:0; max-height:74vh; display:flex; flex-direction:column;}
.kcol-head{padding:10px 12px; border-bottom:1px solid var(--line-soft); font-size:12px; font-weight:600; display:flex; justify-content:space-between; color:var(--ink-2);}
.kcol-body{padding:8px; overflow-y:auto; flex:1;}
.kcard{background:#fff; border:1px solid var(--line); border-radius:4px; padding:10px 11px; margin-bottom:8px; cursor:grab; font-size:12.5px;}
.kcard.dragging{opacity:.4;}
.kcol.dragover{background:var(--brass-tint);}
.kcard .kc-name{font-weight:600; margin-bottom:3px;}
.kcard .kc-meta{color:var(--ink-3); font-size:11px;}

/* AI Generator */
.ai-grid{display:grid; grid-template-columns:340px 1fr; gap:20px; align-items:flex-start;}
@media(max-width:1000px){.ai-grid{grid-template-columns:1fr;}}
.chan-tabs{display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap;}
.chan-tab{padding:7px 13px; border:1px solid var(--line); border-radius:20px; font-size:12.5px; background:#fff; color:var(--ink-2);}
.chan-tab.active{background:var(--ink); color:#fff; border-color:var(--ink);}
.msg-box{border:1px solid var(--line); border-radius:5px; padding:16px; background:var(--paper); min-height:200px; white-space:pre-wrap; font-size:13.5px; line-height:1.65;}
.msg-box[contenteditable]:focus{outline:2px solid var(--brass); background:#fff;}
.qscore{display:flex; align-items:center; gap:10px; margin:14px 0;}
.qscore-num{font-family:'Newsreader',serif; font-size:26px;}
.qscore-bar{flex:1; height:6px; background:var(--line-soft); border-radius:3px; overflow:hidden;}
.qscore-fill{height:100%; background:var(--teal);}
.chip-row{display:flex; gap:6px; flex-wrap:wrap; margin-top:12px;}
.loading-line{color:var(--ink-3); font-size:12.5px; display:flex; align-items:center; gap:8px;}
.spinner{width:13px; height:13px; border:2px solid var(--line); border-top-color:var(--brass); border-radius:50%; animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.toast-wrap{position:fixed; bottom:20px; right:20px; z-index:200; display:flex; flex-direction:column; gap:8px;}
.toast{background:var(--ink); color:#fff; padding:11px 16px; border-radius:5px; font-size:13px; box-shadow:0 8px 20px rgba(0,0,0,.2); animation:toastin .18s ease;}
@keyframes toastin{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

.timeline{border-left:2px solid var(--line); margin-left:6px; padding-left:18px;}
.tl-item{position:relative; padding-bottom:18px;}
.tl-item:before{content:""; position:absolute; left:-24px; top:3px; width:9px; height:9px; border-radius:50%; background:var(--brass);}
.tl-date{font-size:11px; color:var(--ink-3); font-family:'IBM Plex Mono',monospace;}
.tl-text{font-size:13px; margin-top:2px;}

.stat-mini{display:flex; gap:18px; flex-wrap:wrap;}
.stat-mini div{background:var(--paper); border:1px solid var(--line-soft); padding:10px 14px; border-radius:4px; min-width:100px;}
.stat-mini .sv{font-family:'Newsreader',serif; font-size:20px;}
.stat-mini .sl{font-size:10.5px; color:var(--ink-3);}

.readonly-banner{background:var(--brass-tint); color:var(--brass-deep); padding:8px 14px; border-radius:4px; font-size:12.5px; margin-bottom:16px;}
.login-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--paper);}
.login-card{width:340px; background:#fff; border:1px solid var(--line); border-radius:6px; padding:30px; box-shadow:0 8px 30px rgba(22,31,46,.08);}
.login-card h1{font-size:20px; margin-bottom:4px;}
.login-card p.sub{color:var(--ink-3); font-size:12.5px; margin-bottom:18px;}
.login-card label{display:block; font-size:12px; color:var(--ink-2); margin:12px 0 5px;}
.login-card input{width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:4px; font-size:13.5px; outline:none;}
.login-card input:focus{border-color:var(--brass);}
.login-card .btn{width:100%; justify-content:center; margin-top:18px;}
.login-err{color:var(--rust); font-size:12px; margin-top:10px; min-height:14px;}
.login-toggle{text-align:center; font-size:12.5px; color:var(--ink-3); margin-top:14px; cursor:pointer;}
.login-toggle span{color:var(--brass-deep); font-weight:500;}

/* ---------- Mobile ---------- */
.menu-btn{display:none;}
.sidebar-backdrop{display:none;}

@media(max-width:880px){
  #app{display:block;}
  .sidebar{
    position:fixed; left:0; top:0; height:100vh; width:250px; max-width:82vw;
    transform:translateX(-100%); transition:transform .22s ease; z-index:120;
    box-shadow:0 0 40px rgba(0,0,0,.3);
  }
  .sidebar.open{transform:translateX(0);}
  .sidebar-backdrop{
    display:block; position:fixed; inset:0; background:rgba(22,26,34,.45); z-index:110;
    opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .sidebar-backdrop.open{opacity:1; pointer-events:auto;}
  .main{width:100%;}
  .menu-btn{
    display:inline-flex; align-items:center; justify-content:center; width:36px; height:36px;
    border:1px solid var(--line); border-radius:4px; background:#fff; font-size:17px; flex-shrink:0;
  }
  .topbar{flex-wrap:wrap; padding:10px 14px; gap:8px; row-gap:8px;}
  .search-wrap{order:3; flex:1 1 100%; max-width:none;}
  .topbar-right{margin-left:0; flex-wrap:wrap; gap:6px; order:2;}
  .country-select, .role-select{font-size:12px; padding:6px 8px; min-width:0;}
  .user-chip span{display:none;}
  .bell{padding:6px 8px;}
  .content{padding:16px 14px 40px;}
  .page-head{flex-direction:column; align-items:stretch;}
  .page-head h1{font-size:21px;}
  .page-head > div:last-child{display:flex; flex-wrap:wrap; gap:8px;}
  .page-head .btn, .page-head select{flex:1 1 auto;}
  .kpi-row{grid-template-columns:repeat(2,1fr);}
  .kpi{padding:12px 14px;}
  .kpi-val{font-size:23px;}
  .form-grid{grid-template-columns:1fr;}
  .span2{grid-column:span 1;}
  .modal-bg{padding:0; align-items:stretch;}
  .modal{max-width:none; width:100%; min-height:100vh; border-radius:0;}
  .modal.wide{max-width:none;}
  .modal-body{max-height:calc(100vh - 132px);}
  .modal-foot{flex-wrap:wrap;}
  .modal-foot .btn{flex:1 1 auto; justify-content:center;}
  .filters{flex-direction:column; align-items:stretch;}
  .filters select, .filters input[type=text]{min-width:0; width:100%;}
  .filters .fcount{margin-left:0; order:99;}
  .two-col{grid-template-columns:1fr;}
  .ai-grid{grid-template-columns:1fr;}
  .stat-mini{gap:8px;}
  .stat-mini div{min-width:44%; flex:1;}
  .tabs{overflow-x:auto; flex-wrap:nowrap; -webkit-overflow-scrolling:touch;}
  .tab{white-space:nowrap; flex-shrink:0;}
  table{font-size:12.5px;}
  th, td{padding:8px !important;}
  .login-card{width:92vw; padding:24px 20px;}
  .btn{min-height:38px;}
  .nav-item{min-height:40px;}
}

@media(max-width:480px){
  .kpi-row{grid-template-columns:1fr;}
  .page-head h1{font-size:19px;}
  .kpi-val{font-size:21px;}
}
</style>
</head>
<body>

<div id="login-screen" class="login-screen">
  <div class="login-card">
    <h1>IIC Lakshya Marketing CRM</h1>
    <p class="sub" id="loginSub">Sign in with your team account.</p>
    <label for="li_email">Email</label>
    <input id="li_email" type="email" autocomplete="username" placeholder="you@iiclakshya.com">
    <label for="li_pass">Password</label>
    <input id="li_pass" type="password" autocomplete="current-password" placeholder="••••••••">
    <button class="btn brass" id="loginBtn">Sign In</button>
    <div class="login-err" id="loginErr"></div>
    <div class="login-toggle" id="loginToggle">New team member? <span>Create an account</span></div>
  </div>
</div>

<div id="app" style="display:none;"></div>
<div id="toast-wrap" class="toast-wrap"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
/* =========================================================================
   SUPABASE CONFIG — fill these in after you create your Supabase project
   (Project Settings -> API -> Project URL / anon public key)
   ========================================================================= */
const SUPABASE_URL = "https://hvbjpqfsltnptgafmwud.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh2YmpwcWZzbHRucHRnYWZtd3VkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwNTg2NDMsImV4cCI6MjEwNDYzNDY0M30.JtSwqqWJERZDyO9B3PGSJ2gZTBBQ19BNYHruh9DCuQM";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let CURRENT_USER = null;

async function initAuth(){
  const { data:{ session } } = await sb.auth.getSession();
  if(session){ CURRENT_USER = session.user; showApp(); }
  else { showLogin(); }
  sb.auth.onAuthStateChange((event, session)=>{
    if(event==="SIGNED_IN" && session){ CURRENT_USER = session.user; showApp(); }
    if(event==="SIGNED_OUT"){ CURRENT_USER = null; showLogin(); }
  });
}
function showLogin(){
  document.getElementById("login-screen").style.display = "flex";
  document.getElementById("app").style.display = "none";
}
function showApp(){
  document.getElementById("login-screen").style.display = "none";

/* ---------------- scroll memory ----------------
   Every navigation goes through goTo() so that leaving a long list (e.g. the
   Schools table scrolled far down) and coming back to it later restores the
   exact scroll position instead of dumping the user back at the top. */
let SCROLL_MEMORY = {};
function viewKey(v){ return v.name + (v && v.params && v.params.id ? (":" + v.params.id) : ""); }
function goTo(name, params={}){
  SCROLL_MEMORY[viewKey(VIEW)] = window.scrollY;
  VIEW = {name, params};
  render();
  const key = viewKey(VIEW);
  requestAnimationFrame(()=>{ window.scrollTo(0, SCROLL_MEMORY[key] || 0); });
}

const PAGE_SIZE_OPTIONS = [15,25,50,100,200];
function paginate(list, page, pageSize){
  const totalPages = Math.max(1, Math.ceil(list.length / pageSize));
  const p = Math.min(Math.max(1, page), totalPages);
  const start = (p-1)*pageSize;
  return { pageItems: list.slice(start, start+pageSize), page:p, totalPages, total:list.length };
}
function renderPager(page, totalPages, pageSize, navAttr, sizeAttr){
  if(totalPages<=1 && pageSize>=200) return ""; // still show size selector even on 1 page below
  return `
  <div class="pager" style="display:flex; align-items:center; gap:10px; justify-content:flex-end; padding:10px 4px; flex-wrap:wrap;">
    <label style="font-size:12.5px; color:var(--ink-3); display:flex; align-items:center; gap:6px;">

      per page
    </label>
    <div style="display:flex; align-items:center; gap:6px;">
      <button class="btn secondary small" data-page-nav="${navAttr}:first" ${page<=1?"disabled":""}>«</button>
      <button class="btn secondary small" data-page-nav="${navAttr}:prev" ${page<=1?"disabled":""}>‹ Prev</button>
      <span style="font-size:12.5px; color:var(--ink-3);">Page ${page} of ${totalPages}</span>

/* ---------------- storage ---------------- */
/* Shared team workspace: everyone signed in reads/writes the SAME row.
   Simple and reliable; good enough for a small team. If you outgrow it
   (write conflicts from people editing at the exact same moment), the
   next step is splitting each table (schools, contacts, ...) into its
   own Supabase table — ask me and I'll do that migration. */
const WORKSPACE_ID = "lakshya-team";
let LAST_SAVED_AT = null;     // timestamp of the version we last wrote/read — used to detect teammates' changes
let SYNC_TIMER = null;

async function upsertState(){
  const now = new Date().toISOString();
  const { error } = await sb.from("app_state")
    .upsert({ id: WORKSPACE_ID, data: STATE, updated_at: now }, { onConflict: "id" });
  if(error) throw error;
  LAST_SAVED_AT = now;
}

async function saveState(){
  try{
    await upsertState();
  }catch(e){
    console.error("save failed", e);
    // Surface the real reason (permission denied, no unique constraint, network, etc.)
    // instead of a generic message, and retry once after a short delay in case it
    // was a transient network blip or an expired auth session that just refreshed.
    toast("Save failed — " + (e.message || "unknown error") + ". Retrying…");
    setTimeout(async ()=>{
      try{
        await upsertState();
        toast("Saved.");
      }catch(e2){
        console.error("retry save failed", e2);
        toast("Still couldn't save (" + (e2.message || "unknown error") + "). Your changes are only in this tab — ask an admin to check the Supabase table/RLS setup.");
      }
    }, 1500);
  }
}

async function loadState(){
  try{
    const { data, error } = await sb.from("app_state").select("data, updated_at").eq("id", WORKSPACE_ID).maybeSingle();
    if(error) throw error;
    if(data && data.data){ LAST_SAVED_AT = data.updated_at; return data.data; }
  }catch(e){
    console.error("load failed", e);
    toast("Couldn't load the latest data — " + (e.message || "check your connection") + ".");
  }
  return null;
}

/* Lightweight "live" sync: polls just the timestamp every 20s (cheap) and only
   pulls + re-renders the full record when a teammate has actually saved something
   new. Skips while a modal is open so it never yanks away an in-progress edit —
   that edit's own save will reconcile things a moment later. Also re-checks the
   instant the tab regains focus, so switching back to it feels instant. */
function startLiveSync(){
  if(SYNC_TIMER) clearInterval(SYNC_TIMER);
  SYNC_TIMER = setInterval(checkForRemoteUpdate, 20000);
  document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState === "visible") checkForRemoteUpdate(); });
}
async function checkForRemoteUpdate(){
  if(document.getElementById("modalBg")) return;
  try{
    const { data, error } = await sb.from("app_state").select("data, updated_at").eq("id", WORKSPACE_ID).maybeSingle();
    if(error) throw error;
    if(data && data.updated_at && data.updated_at !== LAST_SAVED_AT){
      STATE = data.data;
      LAST_SAVED_AT = data.updated_at;
      render();
      toast("Synced latest changes from your team.");
    }
  }catch(e){ console.error("sync check failed", e); }
}

/* ---------------- data audit: contact/school mismatches ----------------
   Catches rows where a school's name ended up in a contact's "Full Name"
   field (a common CSV-import mistake) and the contact is linked to the
   wrong school as a result. Heuristic, not automatic — every suggestion
   needs a human click to apply. */
const AUDIT_STOPWORDS = new Set([
  "school","schools","academy","private","international","the","of","college","institute",
  "public","national","english","indian","global","modern","group","campus","for","and",
  "mam","sir","mr","mrs","ms","dr","principal","vice","coordinator","counsellor","counselor",
  "head","department","education","educational","world","new","al","city","central","grammar"
]);
function auditTokenize(str){
  return (str||"").toLowerCase().replace(/[^a-z0-9\s]/g," ").split(/\s+/).filter(w=>w.length>=3 && !AUDIT_STOPWORDS.has(w));
}
function findSchoolMismatches(){
  const results = [];
  STATE.contacts.forEach(c=>{
    const nameTokens = new Set(auditTokenize(c.name));
    if(!nameTokens.size) return;
    const assigned = byId(STATE.schools, c.schoolId);
    const assignedTokens = new Set(assigned ? auditTokenize(assigned.name) : []);
    const assignedOverlap = [...nameTokens].filter(t=>assignedTokens.has(t)).length;
    let best = null, bestScore = 0;
    STATE.schools.forEach(s=>{
      if(s.id === c.schoolId) return;
      const sTokens = auditTokenize(s.name);
      if(!sTokens.length) return;
      const matches = sTokens.filter(t=>nameTokens.has(t));
      if(matches.length > bestScore){ bestScore = matches.length; best = {school:s, matches}; }
    });
    const strong = bestScore>=2 || (bestScore===1 && best.matches[0].length>=6);
    if(strong && bestScore > assignedOverlap){
      results.push({contactId:c.id, contactName:c.name, assignedId:assigned?assigned.id:null, assignedName:assigned?assigned.name:"— none —", suggestedId:best.school.id, suggestedName:best.school.name, matchedWords:best.matches});
    }
  });
  return results;
}
function todayISO(offsetDays=0){ const d=new Date(); d.setDate(d.getDate()+offsetDays); return d.toISOString().slice(0,10); }
/* Clamp a yyyy-mm-dd string so it's never in the past and never more than
   MAX_TASK_DAYS_OUT days in the future — used for every task/callback date picker. */
function clampTaskDate(iso){
  const min = todayISO(0), max = todayISO(MAX_TASK_DAYS_OUT);
  if(!iso) return min;
  if(iso < min) return min;
  if(iso > max) return max;
  return iso;
}
function fmtDate(iso){ if(!iso) return "—"; const d=new Date(iso+"T00:00:00"); return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function esc(s){ return (s===undefined||s===null)?"":String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function byId(arr,id){ return arr.find(x=>x.id===id); }

/* ---------------- toast ---------------- */
function toast(msg){
  const wrap=document.getElementById("toast-wrap");
  const el=document.createElement("div"); el.className="toast"; el.textContent=msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.transition="opacity .3s"; el.style.opacity="0"; setTimeout(()=>el.remove(),300); }, 2600);
}

/* ---------------- data helpers ---------------- */
function schoolsFiltered(){
  let list = STATE.schools;
  if(FILTERS.country!=="All") list = list.filter(s=>s.country===FILTERS.country);
  return list;
}
function contactsFiltered(){
  let list = STATE.contacts;
  if(FILTERS.country!=="All") list = list.filter(c=>c.country===FILTERS.country);
  return list;
}
function statusBadgeClass(status){
  const good=["Interested","Session Confirmed","Session Completed","Responded","Enrolled","Completed","Confirmed","Qualified","Qualified Hot"];
  const warn=["Contacted","Meeting Scheduled","Session Proposed","Follow Up Later","New","Proposed","Awaiting Confirmation","Pending","DNP","NATC","Qualified Warm","Qualified Cold","Session Rescheduled"];
  const bad=["Not Interested","Do Not Contact","Lost","Cancelled","Junk","Invalid Number"];
  if(good.includes(status)) return "good";
  if(bad.includes(status)) return "bad";
  if(warn.includes(status)) return "warn";
  return "";
}
function mailtoLink(toEmail){
  const to = (toEmail||"").split(/[;,]/)[0].trim();
  if(!to) return "";
  const cc = STATE.settings.senderEmail || "";
  const q = cc ? `?cc=${encodeURIComponent(cc)}` : "";
  return `mailto:${encodeURIComponent(to)}${q}`;
}
function isReadOnly(){ return FILTERS.role==="View Only"; }
function guardRO(){ if(isReadOnly()){ toast("View Only role — changes are disabled."); return true; } return false; }

/* ---------------- AI ---------------- */
async function callClaude(system, user){
  let res;
  try{
    // Goes to our own Netlify Function, which holds the Anthropic API key
    // server-side and forwards the request. The browser never sees the key.
    res = await fetch("/.netlify/functions/ai-generate", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ system, user })
    });
  }catch(networkErr){
    throw new Error("Network error reaching the AI service: "+networkErr.message);
  }
  let data;
  try{ data = await res.json(); }catch(parseErr){ throw new Error("AI service returned a non-JSON response (HTTP "+res.status+")."); }
  if(!res.ok){
    const msg = data?.error?.message || data?.message || JSON.stringify(data);
    throw new Error("AI service error (HTTP "+res.status+"): "+msg);
  }
  if(data && data.text){
    return data.text.trim();
  }
  throw new Error("AI request failed: unexpected response shape — "+JSON.stringify(data).slice(0,300));
}

function buildAIContext(form){
  const school = byId(STATE.schools, form.schoolId);
  const contact = byId(STATE.contacts, form.contactId);
  const campaign = byId(STATE.campaigns, form.campaignId);
  const s = STATE.settings;
  const known = [];
  if(school){
    known.push(`School: ${school.name}`);
    known.push(`Country: ${school.country}, City: ${school.city}`);
    known.push(`Curriculum: ${school.curriculum}`);
    known.push(`School type: ${school.type}`);
    if(school.commerce) known.push(`Commerce stream available: Grade 11 = ${school.grade11?"yes":"unknown"}, Grade 12 = ${school.grade12?"yes":"unknown"}`);
    if(school.notes) known.push(`Notes on file: ${school.notes}`);
  }
  if(contact){
    known.push(`Contact: ${contact.name}, ${contact.designation}`);
    if(contact.status && contact.status!=="No Response") known.push(`Previous response status: ${contact.status}`);
  }
  if(campaign) known.push(`Campaign: ${campaign.name} (target: ${campaign.audience}, month: ${campaign.sessionMonth})`);
  known.push(`Objective: ${form.objective}`);
  known.push(`Target audience: ${form.audience}`);
  known.push(`Session type: ${form.sessionType}`);
  known.push(`Relevant programs: ${(form.programs||[]).join(", ") || "not specified"}`);
  known.push(`Tone requested: ${form.tone}`);
  return known.join("\n");
}

function systemPromptFor(channel){
  const s = STATE.settings;
  return `You are writing on behalf of ${s.brandName}, a company focused on: ${s.description}
You are drafting a real, ${channel} outreach message to a school contact in the GCC region as part of a B2B school-outreach campaign.

Hard rules:

/* ---------------- quality score heuristic (client-side, advisory) ---------------- */
function scoreMessage(text){
  if(!text) return {score:0, notes:["No content yet."]};
  let score=100; const notes=[];
  const excl = (text.match(/!/g)||[]).length;
  if(excl>2){ score-=10; notes.push("Reduce exclamation marks."); }
  const words = text.split(/\s+/).filter(Boolean).length;
  if(words<40){ score-=15; notes.push("Message may be too short to convey value."); }
  if(words>260){ score-=10; notes.push("Consider shortening — long messages get skipped."); }
  const longParas = text.split(/\n\n+/).filter(p=>p.split(/\s+/).length>90);
  if(longParas.length){ score-=8; notes.push("A paragraph looks long — consider breaking it up."); }
  if(!/\?|call|discuss|available|dates|share|let us know/i.test(text)){ score-=10; notes.push("CTA could be clearer."); }
  if(/guarantee|limited time|act now|don't miss/i.test(text)){ score-=15; notes.push("Wording reads as spam-like urgency."); }
  score = Math.max(30, Math.min(98, score));
  if(!notes.length) notes.push("Personalization and CTA look solid.");
  return {score, notes};
}

function viewCampaignProfile(id){
  const camp = byId(STATE.campaigns, id);
  if(!camp) return `<div class="empty"><h3>Campaign not found</h3></div>`;
  const msgs = STATE.outreachMessages.filter(m=>m.campaignId===id);
  const schoolIds = [...new Set(msgs.map(m=>m.schoolId))];
  const emails = msgs.filter(m=>m.channel==="Email").length;
  const wa = msgs.filter(m=>m.channel==="WhatsApp").length;
  const li = msgs.filter(m=>m.channel==="LinkedIn").length;
  const responses = STATE.followUps.filter(f=>msgs.some(m=>m.contactId===f.contactId) && f.responseStatus!=="No Response").length;
  const interestedSchools = STATE.schools.filter(s=>schoolIds.includes(s.id) && ["Interested","Session Confirmed","Session Completed"].includes(s.status)).length;
  const sessions = STATE.sessions.filter(s=>s.campaignId===id);
  const leads = STATE.studentLeads.filter(l=>l.campaignId===id);
  const apps = leads.filter(l=>["Application Started","Application Submitted","Enrolled"].includes(l.status)).length;
  const enr = leads.filter(l=>l.status==="Enrolled").length;
  const respRate = schoolIds.length ? Math.round((responses/schoolIds.length)*100) : 0;
  const convRate = schoolIds.length ? Math.round((interestedSchools/schoolIds.length)*100) : 0;

  return `
  <div class="page-head">
    <div><div class="page-sub"><span class="tag" style="cursor:pointer;" data-nav="campaigns">← All Campaigns</span></div>
    <h1 style="margin-top:8px;">${esc(camp.name)}</h1>
    <div class="page-sub">${camp.country} · ${camp.audience} · Target session: ${camp.sessionMonth}</div></div>
    <span class="badge st ${statusBadgeClass(camp.status)}" style="font-size:13px; padding:6px 12px;">${camp.status}</span>
  </div>
  <div class="kpi-row" style="grid-template-columns:repeat(4,1fr);">
    <div class="kpi"><div class="kpi-label">Schools Targeted</div><div class="kpi-val">${schoolIds.length}</div></div>
    <div class="kpi"><div class="kpi-label">Response Rate</div><div class="kpi-val">${respRate}%</div></div>
    <div class="kpi"><div class="kpi-label">Session Conversion</div><div class="kpi-val">${convRate}%</div></div>
    <div class="kpi"><div class="kpi-label">Student Leads</div><div class="kpi-val">${leads.length}</div></div>
  </div>
  <div class="two-col">
    <div class="panel"><div class="panel-head"><h3>Outreach Sent</h3></div><div class="panel-body">
      <div class="stat-mini"><div><div class="sv">${emails}</div><div class="sl">Emails</div></div><div><div class="sv">${wa}</div><div class="sl">WhatsApp</div></div><div><div class="sv">${li}</div><div class="sl">LinkedIn</div></div><div><div class="sv">${sessions.length}</div><div class="sl">Sessions</div></div></div>
    </div></div>
    <div class="panel"><div class="panel-head"><h3>Conversion</h3></div><div class="panel-body">
      <div class="stat-mini"><div><div class="sv">${responses}</div><div class="sl">Responses</div></div><div><div class="sv">${interestedSchools}</div><div class="sl">Interested</div></div><div><div class="sv">${apps}</div><div class="sl">Applications</div></div><div><div class="sv">${enr}</div><div class="sl">Enrollments</div></div></div>
    </div></div>
  </div>
  <div class="panel"><div class="panel-head"><h3>Schools in this Campaign</h3></div><div class="panel-body tbl-wrap">
    <table><thead><tr><th>School</th><th>Country</th><th>Status</th></tr></thead><tbody>
      ${schoolIds.map(sid=>{const s=byId(STATE.schools,sid); return s?`<tr class="clickable" data-nav="schoolProfile" data-id="${s.id}"><td>${esc(s.name)}</td><td>${s.country}</td><td><span class="badge st ${statusBadgeClass(s.status)}">${s.status}</span></td></tr>`:"";}).join("") || `<tr><td colspan="3"><div class="empty">No outreach sent for this campaign yet.</div></td></tr>`}
    </tbody></table>
  </div></div>
  `;
}

function openModal(html){
  const bg = document.createElement("div");
  bg.className="modal-bg"; bg.id="modalBg";
  bg.innerHTML = html;
  bg.addEventListener("click", e=>{ if(e.target===bg) closeModal(); });
  document.body.appendChild(bg);
}
function closeModal(){ const bg=document.getElementById("modalBg"); if(bg) bg.remove(); }

function modalShell(title, bodyHtml, footHtml, wide){
  return `<div class="modal ${wide?"wide":""}">

    <div class="modal-body">${bodyHtml}</div>
    <div class="modal-foot">${footHtml}</div>
  </div>`;
}

function openContactProfile(id, tab){
  const c = byId(STATE.contacts, id); if(!c) return;

  const extraPhones = c.extraPhones || [];
  const extraEmails = c.extraEmails || [];

  const tabs = [
    ["details","Details"],

      <div class="field"><label>LinkedIn URL</label><input id="f_clinkedin" value="${esc(c.linkedin||"")}"></div>
      <div class="field"><label>Lead Activity</label><select id="f_cactivity"><option value="">— Select —</option>${LEAD_ACTIVITIES.map(s=>`<option ${c.leadActivity===s?"selected":""}>${s}</option>`).join("")}</select></div>
      <div class="field"><label>Lead Stage</label><select id="f_cstage"><option value="">— Select —</option>${LEAD_STAGES.map(s=>`<option ${c.leadStage===s?"selected":""}>${s}</option>`).join("")}</select></div>

    </div>

      <label>Email addresses</label>

        <div class="contact-multi-row"><input class="email-input" value="${esc(c.email||"")}" placeholder="Primary email"><button type="button" class="btn ghost small remove-row-btn">✕</button></div>

      <label>Notes</label>
      <textarea id="f_cnotes" rows="4">${esc(c.notes||"")}</textarea>

    body = log.length ? `<div class="timeline">${log.map(a=>`<div class="tl-item"><div class="tl-date">${fmtDate(a.date)}</div><div class="tl-text">${esc(a.text)}</div></div>`).join("")}</div>` : `<div class="empty">No activity recorded yet.</div>`;

async function generateOutreach(refineType){
  const f = UI.aiForm; const channel = UI.aiChannel;
  if(!f.schoolId){ toast("Select a school first."); return; }
  if(!f.contactId){ toast("Select a contact first."); return; }
  f.audience = f.audience || AUDIENCES[0]; f.objective = f.objective || OBJECTIVES[0];
  f.sessionType = f.sessionType || SESSION_TYPES[0]; f.tone = f.tone || STATE.settings.defaultTone;

  const line = document.getElementById("aiLoadingLine");
  if(line) line.innerHTML = `<div class="loading-line" style="margin-top:12px;"><div class="spinner"></div>Generating ${channel.toLowerCase()} message…</div>`;
  const btn = document.getElementById("aiGenerateBtn"); if(btn) btn.disabled = true;

  try{
    const system = systemPromptFor(channel);
    let instruction = `Write the ${channel} outreach now, based on:\n${buildAIContext(f)}`;
    if(refineType && refineType!=="regenerate"){
      const prev = UI.aiResult[channel]?.text || "";
      const map = {shorten:"Make this significantly shorter while keeping the key ask.", formal:"Rewrite in a more formal register.", friendly:"Rewrite in a warmer, friendlier register.", persuasive:"Rewrite to be more persuasive while staying factual and professional.", concise:"Make this more concise."};
      instruction = `Here is the previous version:\n"""${prev}"""\n\n${map[refineType]} Keep the same facts, channel format, and signature.`;
    }
    const text = await callClaude(system, instruction);
    const sc = scoreMessage(text);
    UI.aiResult[channel] = {text, score:sc.score, notes:sc.notes};
  }catch(err){
    console.error("Outreach AI generation error:", err);
    toast("AI generation failed: "+err.message);
  }
  if(btn) btn.disabled = false;
  render();
}

function wireModal(){
  const closeBtn = document.getElementById("modalCloseBtn"); if(closeBtn) closeBtn.addEventListener("click", closeModal);
  const cancelBtn = document.getElementById("modalCancelBtn"); if(cancelBtn) cancelBtn.addEventListener("click", closeModal);

  // Contact modal: Lead Activity / Lead Stage drive the Next Task/Callback Date picker —
  // suggest a date automatically, but let the BDE drag it anywhere within the next 30 days.
  // The three closing stages (Not Interested, Junk, Invalid Number) disable the picker entirely.
  const taskDueEl = document.getElementById("f_taskDue");
  if(taskDueEl){
    const activitySel = document.getElementById("f_cactivity");
    const stageSel = document.getElementById("f_cstage");
    const syncTaskDue = ()=>{
      const stage = stageSel ? stageSel.value : "";
      const activity = activitySel ? activitySel.value : "";
      const closing = NO_TASK_STAGES.has(stage) || NO_TASK_STAGES.has(activity);
      taskDueEl.disabled = closing;
      if(!closing){
        const rule = LEAD_ACTIVITY_AUTOMATION[activity];
        taskDueEl.value = clampTaskDate(rule ? todayISO(rule.days) : (taskDueEl.value || todayISO(3)));
      }
    };
    if(activitySel) activitySel.addEventListener("change", syncTaskDue);
    if(stageSel) stageSel.addEventListener("change", syncTaskDue);
    taskDueEl.addEventListener("change", ()=>{ taskDueEl.value = clampTaskDate(taskDueEl.value); });
  }

  const saveSchoolBtn = document.getElementById("saveSchoolBtn");
  if(saveSchoolBtn) saveSchoolBtn.addEventListener("click", ()=>{
    const name = document.getElementById("f_name").value.trim();
    if(!name){ toast("School name is required."); return; }

      id:uid("sch"), name, country:val("f_country"), city:val("f_city"), curriculum:val("f_curriculum"),
      type:val("f_type"), priority:val("f_priority"), website:val("f_website"), phone:val("f_phone"), email:val("f_email"),
      grades:val("f_grades"), notes:val("f_notes"), status:"New", tags:[], isDemo:false, createdAt:todayISO(),
      commerce:true, grade11:true, grade12:true, studentStrength:0
    };
    STATE.schools.push(s);
    STATE.activities.push({id:uid("act"), schoolId:s.id, contactId:null, type:"school", text:"School added to database", date:todayISO()});
    saveState(); closeModal(); toast("School added.");
    goTo("schoolProfile",{id:s.id});
  });

  const saveContactBtn = document.getElementById("saveContactBtn");
  if(saveContactBtn) saveContactBtn.addEventListener("click", ()=>{
    const name = document.getElementById("f_name").value.trim();
    const schoolId = val("f_school");
    if(!name || !schoolId){ toast("Name and school are required."); return; }
    const school = byId(STATE.schools, schoolId);
    const c = {
      id:uid("con"), name, designation:val("f_desig"), schoolId, country: school?.country||"", email:val("f_email"),
      phone:val("f_phone"), whatsapp:val("f_whatsapp"), linkedin:val("f_linkedin"), channel:val("f_channel"),
      decisionScore:val("f_score"), status:"No Response", lastContacted:"", nextFollowup:"", notes:val("f_notes"), isDemo:false
    };
    STATE.contacts.push(c);
    STATE.activities.push({id:uid("act"), schoolId, contactId:c.id, type:"contact", text:"Contact added: "+name, date:todayISO()});
    saveState(); closeModal(); render(); toast("Contact added.");
  });

  // Contact profile modal: tab switching
  document.querySelectorAll("[data-contact-tab]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const cid = el.getAttribute("data-contact-id");
      const t = el.getAttribute("data-contact-tab");
      closeModal(); openContactProfile(cid, t); wireModal();
    });
  });

  // Contact profile modal: add / remove email & phone rows (pure DOM, no full re-render so nothing typed is lost)
  const addEmailBtn = document.getElementById("addEmailBtn");
  if(addEmailBtn) addEmailBtn.addEventListener("click", ()=>{
    const row = document.createElement("div");
    row.className = "contact-multi-row";
    row.innerHTML = `<input class="email-input" placeholder="Additional email"><button type="button" class="btn ghost small remove-row-btn">✕</button>`;
    document.getElementById("emailRows").appendChild(row);
    row.querySelector(".remove-row-btn").addEventListener("click", ()=>row.remove());
    row.querySelector("input").focus();
  });
  const addPhoneBtn = document.getElementById("addPhoneBtn");
  if(addPhoneBtn) addPhoneBtn.addEventListener("click", ()=>{
    const row = document.createElement("div");
    row.className = "contact-multi-row";
    row.innerHTML = `<input class="phone-input" placeholder="Additional phone"><button type="button" class="btn ghost small remove-row-btn">✕</button>`;
    document.getElementById("phoneRows").appendChild(row);
    row.querySelector(".remove-row-btn").addEventListener("click", ()=>row.remove());
    row.querySelector("input").focus();
  });
  document.querySelectorAll(".remove-row-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>btn.closest(".contact-multi-row").remove());
  });

  const gotoSchoolFromContact = document.getElementById("gotoSchoolFromContact");
  if(gotoSchoolFromContact) gotoSchoolFromContact.addEventListener("click", ()=>{
    const sid = gotoSchoolFromContact.getAttribute("data-school-id");
    closeModal(); UI.schoolTab="contacts"; goTo("schoolProfile",{id:sid});
  });

  const goGenerateBtn2 = document.getElementById("goGenerateBtn2");
  if(goGenerateBtn2) goGenerateBtn2.addEventListener("click", ()=>{
    const idEl = document.getElementById("saveContactStatusBtn");
    const id = idEl?.getAttribute("data-id");
    const c = byId(STATE.contacts,id);
    UI.aiForm = {...UI.aiForm, schoolId:c.schoolId, contactId:c.id}; UI.aiResult={};
    closeModal(); goTo("aiGenerator",{});
  });

  const addFollowupBtn = document.getElementById("addFollowupBtn");
  if(addFollowupBtn) addFollowupBtn.addEventListener("click", ()=>{
    const cid = addFollowupBtn.getAttribute("data-id");
    const c = byId(STATE.contacts, cid); if(!c) return;
    const channel = val("f_flwChannel");
    const responseStatus = val("f_flwResponse");
    const nextFollowupDate = val("f_flwDate");
    const note = val("f_flwNote").trim();
    STATE.followUps.push({id:uid("flw"), contactId:cid, schoolId:c.schoolId, channel, message:"", responseStatus, nextFollowupDate, followupCount:0, lastAction:note||("Follow-up logged: "+responseStatus), assignedTo:"Marketing Team", status:"Pending"});
    c.nextFollowup = nextFollowupDate;
    if(responseStatus && responseStatus!=="No Response") c.status = responseStatus;
    STATE.activities.push({id:uid("act"), schoolId:c.schoolId, contactId:cid, type:"followup", text:"Follow-up logged ("+channel+"): "+responseStatus+(note?" — "+note:""), date:todayISO()});
    saveState(); closeModal(); openContactProfile(cid, "followups"); wireModal(); toast("Follow-up added.");
  });

  const saveContactStatusBtn = document.getElementById("saveContactStatusBtn");
  if(saveContactStatusBtn) saveContactStatusBtn.addEventListener("click", ()=>{
    const id = saveContactStatusBtn.getAttribute("data-id");
    const c = byId(STATE.contacts, id);
    const today = todayISO();

    // Save editable contact details (name/designation/channel/score/linkedin/emails/phones/notes) if this modal has those fields
    const nameEl = document.getElementById("f_cname");
    if(nameEl){
      const newName = nameEl.value.trim();
      const newDesig = val("f_cdesig");
      const newChannel = val("f_cchannel");
      const newScore = val("f_cscore");
      const newLinkedin = val("f_clinkedin").trim();
      const newNotes = document.getElementById("f_cnotes") ? document.getElementById("f_cnotes").value : c.notes;

      const emailInputs = Array.from(document.querySelectorAll(".email-input")).map(i=>i.value.trim()).filter(Boolean);
      const phoneInputs = Array.from(document.querySelectorAll(".phone-input")).map(i=>i.value.trim()).filter(Boolean);
      const newEmail = emailInputs[0] || "";
      const newPhone = phoneInputs[0] || "";
      const newExtraEmails = emailInputs.slice(1);
      const newExtraPhones = phoneInputs.slice(1);

      const changed = newName!==c.name || newDesig!==c.designation || newChannel!==c.channel || newEmail!==(c.email||"") || newPhone!==(c.phone||"")
        || JSON.stringify(newExtraEmails)!==JSON.stringify(c.extraEmails||[]) || JSON.stringify(newExtraPhones)!==JSON.stringify(c.extraPhones||[]);
      if(newName) c.name = newName;
      c.designation = newDesig; c.channel = newChannel; c.email = newEmail; c.phone = newPhone;
      c.decisionScore = newScore; c.linkedin = newLinkedin; c.notes = newNotes;
      c.extraEmails = newExtraEmails; c.extraPhones = newExtraPhones;
      if(changed) STATE.activities.push({id:uid("act"), schoolId:c.schoolId, contactId:c.id, type:"contact", text:"Contact details updated", date:today});
    }

    const activity = val("f_cactivity");
    const stage = val("f_cstage");
    const taskDueEl2 = document.getElementById("f_taskDue");
    const taskDue = clampTaskDate((taskDueEl2 && taskDueEl2.value) || todayISO(3));
    if(!activity && !stage){ saveState(); closeModal(); render(); toast("Contact updated."); return; }
    let ruleForActivity = null;
    if(activity){
      c.leadActivity = activity;
      c.status = activity; // keep legacy status field in sync for filters/badges
      c.lastContacted = today;
      STATE.activities.push({id:uid("act"), schoolId:c.schoolId, contactId:c.id, type:"call", text:"Lead Activity updated to "+activity, date:today});
      ruleForActivity = LEAD_ACTIVITY_AUTOMATION[activity];
      if(ruleForActivity && !stage) c.leadStage = ruleForActivity.stage; // auto-set stage if BDE didn't pick one
    }
    if(stage){
      c.leadStage = stage;
      STATE.activities.push({id:uid("act"), schoolId:c.schoolId, contactId:c.id, type:"stage", text:"Lead Stage changed to "+stage, date:today});
      const sch = byId(STATE.schools, c.schoolId);
      if(sch){
        const stageToSchoolStatus = {"DNP":"Follow Up Later","NATC":"Follow Up Later","Qualified":"Interested","Not Interested":"Not Interested","Session Confirmed":"Session Confirmed","Session Rescheduled":"Follow Up Later","Junk":"Do Not Contact","Invalid Number":"Do Not Contact"};
        if(stageToSchoolStatus[stage]) sch.status = stageToSchoolStatus[stage];
      }
    }
    // Every stage/activity EXCEPT Not Interested / Junk / Invalid Number must leave behind a
    // follow-up task on the BDE's chosen date (clamped to the next 30 days), so a lead never
    // goes quiet — e.g. a DNP today always resurfaces as a task, and calling again and getting
    // DNP again just schedules the next one, building up the lead's full call history.
    const effectiveStage = c.leadStage || "";
    const closingOut = NO_TASK_STAGES.has(activity) || NO_TASK_STAGES.has(effectiveStage);
    if(!closingOut){
      const taskTitle = (ruleForActivity && ruleForActivity.task) ? ruleForActivity.task+" — "+c.name : "Follow up with "+c.name;
      const priority = ruleForActivity ? ruleForActivity.priority : "Medium";
      STATE.tasks.push({id:uid("tsk"), title:taskTitle, type:"Call", contactId:c.id, schoolId:c.schoolId, dueDate:taskDue, priority, assignedTo:"Marketing Team", status:"Pending"});
      STATE.activities.push({id:uid("act"), schoolId:c.schoolId, contactId:c.id, type:"task", text:"Task scheduled for "+fmtDate(taskDue)+": "+taskTitle, date:today});
    }
    saveState(); closeModal(); render(); toast(closingOut ? "Lead updated." : "Lead updated — task set for "+fmtDate(taskDue)+".");
  });
  const goGenBtn = document.getElementById("goGenerateBtn");
  if(goGenBtn) goGenBtn.addEventListener("click", ()=>{
    const idEl = document.getElementById("saveContactStatusBtn");
    const id = idEl?.getAttribute("data-id");
    const c = byId(STATE.contacts,id);
    UI.aiForm = {...UI.aiForm, schoolId:c.schoolId, contactId:c.id}; UI.aiResult={};
    closeModal(); goTo("aiGenerator",{});
  });

  const saveCampaignBtn = document.getElementById("saveCampaignBtn");
  if(saveCampaignBtn) saveCampaignBtn.addEventListener("click", ()=>{
    const name = document.getElementById("f_name").value.trim();
    if(!name){ toast("Campaign name is required."); return; }
    STATE.campaigns.push({
      id:uid("cmp"), name, country:val("f_country"), audience:val("f_audience"), grade:"", curriculum:val("f_curriculum"),
      programs:[], startDate:todayISO(), endDate:todayISO(60), sessionMonth:val("f_month"), sessionType:val("f_sessType"),
      objective:"Request Career Guidance Session", assignedTo:"Marketing Team", status:val("f_status"), isDemo:false
    });
    saveState(); closeModal(); render(); toast("Campaign created.");
  });

  const saveSessionBtn = document.getElementById("saveSessionBtn");
  if(saveSessionBtn) saveSessionBtn.addEventListener("click", ()=>{
    const title = document.getElementById("f_title").value.trim();
    const schoolId = val("f_school");
    if(!title || !schoolId){ toast("Title and school are required."); return; }
    const s = {
      id:uid("ses"), schoolId, campaignId: val("f_campaign")||null, title, date:val("f_date"), time:val("f_time"),
      duration:"60 min", type:val("f_type"), targetGrade:"11 & 12", expectedStudents:Number(val("f_expected"))||0, actualStudents:0,
      speaker:"", status:"Proposed", notes:"", studentsAttended:0, leadsGenerated:0, counsellingRequests:0, applications:0, enrollments:0
    };
    STATE.sessions.push(s);
    STATE.activities.push({id:uid("act"), schoolId, contactId:null, type:"session", text:"Session proposed: "+title, date:todayISO()});
    saveState(); closeModal(); render(); toast("Session created.");
  });

  const saveSessionResultsBtn = document.getElementById("saveSessionResultsBtn");
  if(saveSessionResultsBtn) saveSessionResultsBtn.addEventListener("click", ()=>{
    const id = saveSessionResultsBtn.getAttribute("data-id");
    const s = byId(STATE.sessions, id);
    s.studentsAttended = Number(val("f_att"))||0; s.leadsGenerated = Number(val("f_lead"))||0;
    s.counsellingRequests = Number(val("f_couns"))||0; s.applications = Number(val("f_apps"))||0;
    s.enrollments = Number(val("f_enr"))||0; s.notes = val("f_snotes"); s.status="Completed";
    STATE.activities.push({id:uid("act"), schoolId:s.schoolId, contactId:null, type:"session", text:"Session completed — results recorded", date:todayISO()});
    saveState(); closeModal(); render(); toast("Session results saved.");
  });

  const saveLeadBtn = document.getElementById("saveLeadBtn");
  if(saveLeadBtn) saveLeadBtn.addEventListener("click", ()=>{
    const name = document.getElementById("f_name").value.trim();
    if(!name){ toast("Student name is required."); return; }
    const schoolId = val("f_school");
    const school = byId(STATE.schools, schoolId);
    STATE.studentLeads.push({
      id:uid("lea"), name, country: school?.country||"", schoolId, grade:val("f_grade"), curriculum: school?.curriculum||"",
      program:val("f_program"), source:val("f_source"), campaignId:null, phone:val("f_phone"), email:val("f_email"),
      parentName:val("f_parent"), parentPhone:"", status:"New", counsellor:"Renold", lastContacted:"", nextFollowup:"", notes:"", isDemo:false
    });
    saveState(); closeModal(); render(); toast("Student lead added.");
  });

  const saveTaskBtn = document.getElementById("saveTaskBtn");
  if(saveTaskBtn) saveTaskBtn.addEventListener("click", ()=>{
    const title = document.getElementById("f_title").value.trim();
    if(!title){ toast("Task title is required."); return; }
    STATE.tasks.push({id:uid("tsk"), title, type:val("f_type"), contactId:null, schoolId:val("f_school")||null, dueDate:val("f_due"), priority:val("f_priority"), assignedTo:"Marketing Team", status:"Pending"});
    saveState(); closeModal(); render(); toast("Task added.");
  });

  const saveTemplateBtn = document.getElementById("saveTemplateBtn");
  if(saveTemplateBtn) saveTemplateBtn.addEventListener("click", ()=>{
    const name = document.getElementById("f_name").value.trim();
    if(!name){ toast("Template name is required."); return; }
    STATE.templates.push({id:uid("tpl"), category:val("f_cat"), name, subject:val("f_subject"), body:val("f_body"), variables:[], isDefault:false});
    saveState(); closeModal(); render(); toast("Template saved.");
  });

  const previewCsvBtn = document.getElementById("previewCsvBtn");
  if(previewCsvBtn) previewCsvBtn.addEventListener("click", ()=>{
    const raw = document.getElementById("f_csv").value.trim();
    const preview = document.getElementById("csvPreview");
    if(!raw){ preview.innerHTML = "<div class='empty'>Paste CSV content above first.</div>"; return; }
    const rows = parseCsv(raw);
    const dupes = rows.filter(r=>STATE.schools.some(s=>s.name.toLowerCase()===((r["School Name"]||"").toLowerCase()) && s.country===(r["Country"]||"")));
    preview.innerHTML = `<div class="panel" style="margin-top:14px;"><div class="panel-body tbl-wrap">
      <p class="page-sub">${rows.length} rows found${dupes.length?`, <strong style="color:var(--rust);">${dupes.length} possible duplicate(s)</strong> by School Name + Country`:""}.</p>
      <table><thead><tr><th>School</th><th>Country</th><th>City</th><th>Curriculum</th></tr></thead><tbody>
      ${rows.slice(0,10).map(r=>`<tr><td>${esc(r["School Name"]||"")}</td><td>${esc(r["Country"]||"")}</td><td>${esc(r["City"]||"")}</td><td>${esc(r["Curriculum"]||"")}</td></tr>`).join("")}
      </tbody></table></div></div>`;
  });
  const confirmCsvBtn = document.getElementById("confirmCsvBtn");
  if(confirmCsvBtn) confirmCsvBtn.addEventListener("click", ()=>{
    const raw = document.getElementById("f_csv").value.trim();
    if(!raw){ toast("Paste CSV content first."); return; }
    const rows = parseCsv(raw);
    let added=0, skipped=0;
    rows.forEach(r=>{
      const name=(r["School Name"]||"").trim(); const country=(r["Country"]||"").trim();
      if(!name || !country) return;
      if(STATE.schools.some(s=>s.name.toLowerCase()===name.toLowerCase() && s.country===country)){ skipped++; return; }
      STATE.schools.push({
        id:uid("sch"), name, country, city:r["City"]||"", website:r["Website"]||"", email:r["Email"]||"", phone:r["Phone"]||"",
        curriculum: CURRICULA.includes(r["Curriculum"])?r["Curriculum"]:"Other", type:"Private", grades:"", priority:"Medium",
        status:"New", tags:[], notes:r["Notes"]||"", isDemo:false, createdAt:todayISO(), commerce:true, grade11:true, grade12:true, studentStrength:0
      });
      added++;
    });
    saveState(); closeModal(); render(); toast(`Imported ${added} schools${skipped?`, skipped ${skipped} duplicate(s)`:""}.`);
  });

  const saveSettingsBtn = document.getElementById("saveSettingsBtn");
  if(saveSettingsBtn) saveSettingsBtn.addEventListener("click", ()=>{
    STATE.settings.brandName = val("setBrand"); STATE.settings.defaultTone = val("setTone");
    STATE.settings.senderName = val("setSenderName"); STATE.settings.senderEmail = val("setSenderEmail");
    STATE.settings.description = val("setDesc"); STATE.settings.signature = val("setSig"); STATE.settings.defaultCTA = val("setCTA");
    saveState(); toast("Settings saved.");
  });

  // Data audit — school/contact mismatches
  const runAuditBtn = document.getElementById("runAuditBtn");
  if(runAuditBtn) runAuditBtn.addEventListener("click", ()=>{
    UI.audit.results = findSchoolMismatches();
    UI.audit.dismissed = [];
    UI.audit.ran = true;
    render();
    toast(UI.audit.results.length ? `Found ${UI.audit.results.length} possible mismatch(es).` : "No mismatches found.");
  });
  document.querySelectorAll("[data-audit-fix]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      if(guardRO()) return;
      const cid = btn.getAttribute("data-audit-fix");
      const sid = btn.getAttribute("data-audit-school");
      const c = byId(STATE.contacts, cid);
      const newSchool = byId(STATE.schools, sid);
      if(!c || !newSchool) return;
      const oldSchool = byId(STATE.schools, c.schoolId);
      c.schoolId = sid;
      STATE.activities.push({id:uid("act"), schoolId:sid, contactId:cid, type:"reassign", text:`Contact reassigned from "${oldSchool?oldSchool.name:"—"}" to "${newSchool.name}" via data audit`, date:todayISO()});
      UI.audit.dismissed.push(cid);
      saveState(); render();
      toast(`Reassigned "${c.name}" to ${newSchool.name}.`);
    });
  });
  document.querySelectorAll("[data-audit-dismiss]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      UI.audit.dismissed.push(btn.getAttribute("data-audit-dismiss"));
      render();
    });
  });
}
function val(id){ const el=document.getElementById(id); return el ? el.value : ""; }
function parseCsv(raw){
  const lines = raw.split(/\r?\n/).filter(l=>l.trim());
  if(!lines.length) return [];
  const headers = lines[0].split(",").map(h=>h.trim());
  return lines.slice(1).map(line=>{
    const cells = line.split(",").map(c=>c.trim());
    const obj = {}; headers.forEach((h,i)=>obj[h]=cells[i]||""); return obj;
  });
}

/* ============================= INIT ============================= */
async function init(){
  document.getElementById("app").innerHTML = `<div style="padding:60px; text-align:center; color:#5A6A83; font-family:Inter,sans-serif;">Loading IIC Lakshya Marketing CRM…</div>`;
  const saved = await loadState();
  if(saved){ STATE = saved; }
  else { STATE = seed(); await saveState(); }
  // fill in missing arrays for forward-compat
  ["schools","contacts","campaigns","outreachMessages","followUps","sessions","studentLeads","tasks","activities","templates"].forEach(k=>{ if(!STATE[k]) STATE[k]=[]; });
  if(!STATE.settings) STATE.settings = seed().settings;
  UI.aiForm.tone = STATE.settings.defaultTone;
  render();
  startLiveSync();
}
</script>
